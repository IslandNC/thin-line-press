<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Thin Line Press</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#090909">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--ink:#090909;--paper:#eee9df;--red:#e5341d;--gold:#c9a673;--sans:Manrope,Arial,sans-serif;--serif:'Playfair Display',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--paper);font-family:var(--sans);display:grid;place-items:center;padding:8vw 7vw;text-align:center}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.12;z-index:10;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E")}
a{color:inherit;text-decoration:none}
.kicker{color:var(--gold);font:10px var(--mono);text-transform:uppercase;letter-spacing:.14em}
h1{font:500 clamp(3.4rem,11vw,7.5rem)/.82 var(--serif);letter-spacing:-.09em;margin:26px 0 22px}
h1 em{font-style:italic;color:var(--red)}
p{max-width:430px;margin:0 auto 38px;font-size:17px;line-height:1.55;color:#c0bab0}
.button{display:inline-flex;align-items:center;gap:15px;padding:15px 18px;background:var(--red);color:#fff;border:1px solid var(--red);font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;transition:.25s}
.button:hover{transform:translateY(-3px);background:#f04a35;border-color:#f04a35}
.fr{margin-top:22px;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#8d867c}
.fr a{color:var(--gold)}
.wordmark{margin-top:60px;font-size:13px;font-weight:800;letter-spacing:-.08em;color:#8d867c}
.wordmark b{font-family:var(--serif);font-size:18px;font-weight:500;font-style:italic}
</style>
</head>
<body>
<div class="grain"></div>
<main>
<div class="kicker">Error / 404</div>
<h1>This line <em>broke.</em></h1>
<p>The page you were looking for is not part of the record. It may have moved, or it may never have existed.</p>
<a class="button" href="/">Return to the press <span>↘</span></a>
<div class="fr" lang="fr">Page introuvable. <a href="/fr/">Retour à l’accueil</a></div>
<div class="wordmark">THIN <b>LINE</b> PRESS</div>
</main>
</body>
</html>
